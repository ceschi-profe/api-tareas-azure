name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Validar (build)
        run: |
          python -m compileall -q app
          python -c "from app import create_app; create_app()"

      - name: Pruebas
        run: bash scripts/pruebas.sh

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas
          path: reportes/
          if-no-files-found: error

  empaquetar:
    name: Empaquetar imagen
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@v7

      - name: Calcular nombre de la imagen
        id: nombre
        # GHCR exige minúsculas; ${VAR,,} las convierte en Bash.
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Construir imagen
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: |
          docker build \
            --build-arg APP_VERSION="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGEN" .
          docker image ls "$IMAGEN"

      - name: Publicar imagen
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: docker push "$IMAGEN"

  staging:
    name: Desplegar en staging
    needs: empaquetar
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Desplegar contenedor
        env:
          IMAGEN: ${{ needs.empaquetar.outputs.imagen }}
        run: docker run -d --name api -p 8080:8000 -e APP_ENV=staging "$IMAGEN"

      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:8080

  produccion:
    name: Desplegar en producción (VM de Azure)
    needs: [empaquetar, staging]
    runs-on: ubuntu-latest
    # El environment "produccion" tiene un revisor obligatorio y guarda los datos de la VM:
    # variables VM_HOST, VM_USER y VM_KNOWN_HOSTS, y el secreto VM_SSH_KEY.
    environment:
      name: produccion
      url: http://${{ vars.VM_HOST }}/version
    steps:
      - uses: actions/checkout@v7

      - name: Preparar la conexión SSH
        env:
          LLAVE: ${{ secrets.VM_SSH_KEY }}
          CONOCIDOS: ${{ vars.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LLAVE" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          printf '%s\n' "$CONOCIDOS" > ~/.ssh/known_hosts

      - name: Desplegar en la VM
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGEN: ${{ needs.empaquetar.outputs.imagen }}
          DESTINO: ${{ vars.VM_USER }}@${{ vars.VM_HOST }}
        run: |
          # En la VM: iniciar sesión en GHCR con el token de este job (llega por la entrada estándar),
          # descargar la imagen, reemplazar el contenedor y cerrar la sesión al terminar, aunque algo falle.
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/id_vm "$DESTINO" \
            "set -e; trap 'docker logout ghcr.io' EXIT
             docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
             docker pull $IMAGEN
             docker rm -f api || true
             docker run -d --name api --restart unless-stopped -p 80:8000 -e APP_ENV=produccion $IMAGEN"

      - name: Smoke test contra la VM
        env:
          VERSION_ESPERADA: ${{ github.sha }}
        run: bash scripts/smoke.sh "http://${{ vars.VM_HOST }}"
